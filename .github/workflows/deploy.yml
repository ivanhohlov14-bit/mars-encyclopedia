name: Build and deploy MkDocs site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs mkdocs-advanced-seo Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Auto-add descriptions
        run: python scripts/add_descriptions.py

      - name: Optimize image URLs
        run: python scripts/optimize_urls.py

      - name: Compress images to WebP
        run: python scripts/compress_images.py

      - name: Switch image links to WebP
        run: python scripts/use_webp.py

      - name: Build site
        run: mkdocs build --verbose

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
