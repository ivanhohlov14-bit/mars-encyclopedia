<h1 id="interactive-title" style="text-align:center; font-size: 2.2rem; letter-spacing: 2px;">🎮 Интерактив</h1>

<div id="interactive-container" style="max-width: 960px; margin: 0 auto; font-family: 'Segoe UI', -apple-system, sans-serif; position: relative; z-index: 1; padding: 0 8px;">
    <div style="text-align:center; padding: 60px 20px;">
        <div style="display:inline-block; width: 48px; height: 48px; border: 3px solid #6C63FF; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="color: #999; margin-top: 16px;">Загрузка интерактива...</p>
    </div>
</div>

<style>
/* ============================================================
   БАЗОВЫЕ СТИЛИ
   ============================================================ */
:root {
    --kingdom-color: #6C63FF;
    --kingdom-bg: #F0F4FF;
    --kingdom-light: #A29BFE;
    --kingdom-shadow: rgba(108, 99, 255, 0.25);
}

@keyframes spin { to { transform: rotate(360deg); } }

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

@keyframes glow {
    0%, 100% { box-shadow: 0 0 20px var(--kingdom-shadow); }
    50% { box-shadow: 0 0 40px var(--kingdom-shadow); }
}

.fade-in { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
.slide-in { animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

/* ============================================================
   ЗАГОЛОВОК СТРАНИЦЫ
   ============================================================ */
#interactive-title {
    background: linear-gradient(135deg, var(--kingdom-color), var(--kingdom-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

/* ============================================================
   КАРТОЧКИ ИНТЕРАКТИВА
   ============================================================ */
.interactive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
}

.interactive-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 2px solid transparent;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    text-decoration: none;
    color: inherit;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    min-height: 240px;
    justify-content: center;
}

.interactive-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100%;
    background: linear-gradient(135deg, var(--kingdom-color) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 0;
}

.interactive-card::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: rotate(45deg);
    transition: all 0.6s;
    z-index: 1;
}

.interactive-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: var(--kingdom-color);
    box-shadow: 0 24px 48px -12px var(--kingdom-shadow);
}

.interactive-card:hover::before { opacity: 1; }

.interactive-card > * { position: relative; z-index: 2; }

.interactive-card .ic-icon {
    font-size: 3.5rem;
    margin-bottom: 16px;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.15));
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: inline-block;
}

.interactive-card:hover .ic-icon {
    transform: scale(1.2) rotate(-8deg) translateY(-4px);
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
}

.interactive-card .ic-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: #2c3e50;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
    transition: color 0.3s;
}

.interactive-card:hover .ic-title {
    color: var(--kingdom-color);
}

.interactive-card .ic-desc {
    font-size: 0.85rem;
    color: #777;
    line-height: 1.5;
    max-width: 240px;
}

.interactive-card .ic-badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: var(--kingdom-color);
    color: #fff;
    opacity: 0.9;
    transition: all 0.3s;
}

.interactive-card:hover .ic-badge {
    transform: scale(1.05);
    box-shadow: 0 4px 12px var(--kingdom-shadow);
}

/* ============================================================
   БЛОК СТАТИСТИКИ ИНТЕРАКТИВА
   ============================================================ */
.stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
}

.stat-pill {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    padding: 16px;
    border-radius: 14px;
    text-align: center;
    border: 2px solid var(--kingdom-color);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.stat-pill:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px -8px var(--kingdom-shadow);
}

.stat-pill .sp-value {
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--kingdom-color), var(--kingdom-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
}

.stat-pill .sp-label {
    font-size: 0.72rem;
    color: #888;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
}

/* ============================================================
   СЕКЦИЯ С ВИКТОРИНАМИ
   ============================================================ */
.quiz-card {
    background: linear-gradient(135deg, var(--kingdom-color), var(--kingdom-light));
    border-radius: 20px;
    padding: 32px;
    color: #fff;
    text-align: center;
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 16px 40px -8px var(--kingdom-shadow);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.quiz-card::before {
    content: '';
    position: absolute;
    top: -60%;
    right: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
    border-radius: 50%;
    animation: float 6s ease-in-out infinite;
}

.quiz-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 24px 56px -12px var(--kingdom-shadow);
}

.quiz-card > * { position: relative; z-index: 1; }

.quiz-card .quiz-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    display: block;
}

.quiz-card .quiz-title {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 8px;
}

.quiz-card .quiz-desc {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-bottom: 20px;
    line-height: 1.5;
}

.quiz-btn {
    display: inline-block;
    padding: 12px 32px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 40px;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    transition: all 0.3s;
    cursor: pointer;
}

.quiz-btn:hover {
    background: rgba(255, 255, 255, 0.4);
    transform: scale(1.05);
    color: #fff;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
}

/* ============================================================
   ТЁМНАЯ ТЕМА
   ============================================================ */
@media (prefers-color-scheme: dark) {
    .interactive-card {
        background: rgba(30, 30, 46, 0.85);
        color: #d4d4e8;
    }
    .interactive-card .ic-title { color: #e0e0e0; }
    .interactive-card .ic-desc { color: #aaa; }
    .stat-pill {
        background: rgba(30, 30, 46, 0.85);
        color: #d4d4e8;
    }
    .stat-pill .sp-label { color: #888; }
}

/* ============================================================
   АДАПТИВНОСТЬ
   ============================================================ */
@media (max-width: 600px) {
    #interactive-title { font-size: 1.6rem !important; }
    .interactive-grid { grid-template-columns: 1fr; gap: 16px; }
    .interactive-card { padding: 24px 18px; min-height: 200px; }
    .interactive-card .ic-icon { font-size: 2.8rem; }
    .interactive-card .ic-title { font-size: 1.05rem; }
    .quiz-card { padding: 24px 18px; }
    .quiz-card .quiz-title { font-size: 1.2rem; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 601px) and (max-width: 900px) {
    .interactive-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ncytbgbzfjfoqmmgfygz.supabase.co";
const SUPABASE_KEY = "sb_publishable_v5qJYCi85UdrUsz0tAOohQ_0wWdMR3D";

// ============================================================
// КОРОЛЕВСТВА (тема оформления)
// ============================================================
const KINGDOMS = {
    'Аркадия':    { color: '#D4A574', bg: '#FDF8F0', light: '#E8C9A0' },
    'Ксанф':      { color: '#3D3D3D', bg: '#F5F5F5', light: '#6B6B6B' },
    'Эдем':       { color: '#F4A460', bg: '#FFF8F0', light: '#F7C98A' },
    'Эридания':   { color: '#F5D76E', bg: '#FFFDF5', light: '#FAE9A0' },
    'Кхонг':      { color: '#A9A9A9', bg: '#F8F8F8', light: '#C8C8C8' },
    'Авсония':    { color: '#87CEEB', bg: '#F0F8FF', light: '#B0D8EB' },
    'Кимерия':    { color: '#B19CD9', bg: '#F8F4FF', light: '#D1C4E9' },
    'Серпентида': { color: '#E57373', bg: '#FFF5F5', light: '#F5A0A0' },
    'Эритрей':    { color: '#64B5F6', bg: '#F0F8FF', light: '#90CAF9' },
    'Утопия':     { color: '#4DD0E1', bg: '#F0FDFF', light: '#80DEEA' },
    'Эллада':     { color: '#FF8A65', bg: '#FFF5F0', light: '#FFAB91' },
    'Аливасото':  { color: '#81C784', bg: '#F0FFF0', light: '#A5D6A7' }
};

// ============================================================
// СПИСОК ИНТЕРАКТИВНЫХ РАЗДЕЛОВ
// ============================================================
const INTERACTIVE_ITEMS = [
    {
        icon: '🏛️',
        title: 'Марсианская империя',
        desc: 'Управляйте колонией, стройте базы, собирайте ресурсы и исследуйте планету',
        link: '/game/',
        badge: 'Стратегия'
    },
    {
        icon: '🗺️',
        title: 'Карта Марса',
        desc: 'Интерактивный 3D-глобус с метками городов, морей и регионов',
        link: '/globe-map/',
        badge: '3D-карта'
    },
    {
        icon: '🪐',
        title: 'К Исходу',
        desc: 'Сюжетная игра с выбором пути и последствиями для судьбы Марса',
        link: '/interactive/exodus/',
        badge: 'Квест'
    },
    {
        icon: '🗣️',
        title: 'Переводчик',
        desc: 'Переводите слова и фразы на марсианский язык и обратно',
        link: '/translator/',
        badge: 'Язык'
    },
    {
        icon: '🎵',
        title: 'Конструктор мелодий',
        desc: 'Создавайте музыку из 7 нот марсианского звукоряда со звуком гуслей',
        link: '/music/constructor/',
        badge: 'Музыка'
    },
    {
        icon: '📊',
        title: 'Моя статистика',
        desc: 'Следите за своими достижениями, опытом и прогрессом',
        link: '/stats/',
        badge: 'Прогресс'
    }
];

// ============================================================
// ЗАГРУЗКА И ОТРИСОВКА
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
    const container = document.getElementById('interactive-container');
    const titleEl = document.getElementById('interactive-title');

    // Пытаемся получить профиль для темы королевства
    let kingdom = KINGDOMS['Эдем'];
    let isLoggedIn = false;

    try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data: { session } } = await client.auth.getSession();

        if (session?.user) {
            isLoggedIn = true;
            const { data: profile } = await client
                .from('profiles')
                .select('kingdom')
                .eq('user_id', session.user.id)
                .single();

            if (profile?.kingdom && KINGDOMS[profile.kingdom]) {
                kingdom = KINGDOMS[profile.kingdom];
            }
        }
    } catch (e) {
        console.warn('Не удалось загрузить профиль:', e);
    }

    // Применяем тему королевства
    document.documentElement.style.setProperty('--kingdom-color', kingdom.color);
    document.documentElement.style.setProperty('--kingdom-bg', kingdom.bg);
    document.documentElement.style.setProperty('--kingdom-light', kingdom.light);
    document.documentElement.style.setProperty('--kingdom-shadow', kingdom.color + '40');

    document.body.style.background = kingdom.bg;
    document.body.style.backgroundAttachment = 'fixed';

    // ============================================================
    // РЕНДЕР
    // ============================================================
    container.innerHTML = `
        <!-- Карточки интерактива -->
        <div class="interactive-grid">
            ${INTERACTIVE_ITEMS.map((item, i) => `
                <a href="${item.link}" class="interactive-card fade-in" style="animation-delay: ${i * 0.08}s;">
                    <span class="ic-icon">${item.icon}</span>
                    <span class="ic-title">${item.title}</span>
                    <span class="ic-desc">${item.desc}</span>
                    <span class="ic-badge">${item.badge}</span>
                </a>
            `).join('')}
        </div>

        <!-- Секция викторин -->
        <div class="quiz-card fade-in">
            <span class="quiz-icon">🧠</span>
            <div class="quiz-title">Проверь свои знания!</div>
            <div class="quiz-desc">
                Викторины по истории, географии, персонажам и языку Марса.
                Зарабатывай опыт, получай достижения и становись Легендой Марса!
            </div>
            <a href="/game/" class="quiz-btn">🎮 Начать играть</a>
        </div>

        <!-- Статистика интерактива -->
        <div class="stats-bar fade-in">
            <div class="stat-pill">
                <div class="sp-value">6</div>
                <div class="sp-label">Режимов</div>
            </div>
            <div class="stat-pill">
                <div class="sp-value">50+</div>
                <div class="sp-label">Часов контента</div>
            </div>
            <div class="stat-pill">
                <div class="sp-value">12</div>
                <div class="sp-label">Королевств</div>
            </div>
            <div class="stat-pill">
                <div class="sp-value">∞</div>
                <div class="sp-label">Возможностей</div>
            </div>
        </div>

        <!-- Возврат -->
        <p style="margin-top: 24px; text-align: center;">
            <a href="/" style="color: var(--kingdom-color); text-decoration: none; font-weight: 600;">← На главную</a>
        </p>
    `;

    // Применяем цвет заголовка
    titleEl.style.color = kingdom.color;
    titleEl.style.textShadow = `0 2px 12px ${kingdom.color}40`;
});
</script>
