site_name: Марсианская энциклопедия
site_url: https://mars-wiki.ru/
site_favicon: assets/favicon.png

theme:
  name: readthedocs
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.png
  sticky_navigation: true
  collapse_navigation: true
    
plugins:
  - search
  - advanced-seo:
      url_base: "https://mars-wiki.ru"
      use_canonical_url: true
      add_schema_org_json_ld: true

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - footnotes
  - md_in_html 

# ✅ НОВОЕ: метатеги для соцсетей и поисковиков
extra:
  meta:
    - property: og:type
      content: website
    - property: og:site_name
      content: Марсианская энциклопедия
    - property: og:title
      content: Марсианская энциклопедия
    - property: og:description
      content: Свободный справочник о мире «Письмо из Красной пыли»
    - property: og:image
      content: https://raw.githubusercontent.com/ivanhohlov14-bit/mars-encyclopedia/main/docs/assets/images/header-banner.png
    - property: og:url
      content: https://mars-wiki.ru/
    - name: twitter:card
      content: summary_large_image
    - name: twitter:title
      content: Марсианская энциклопедия
    - name: twitter:description
      content: Свободный справочник о мире «Письмо из Красной пыли»
    - name: twitter:image
      content: https://raw.githubusercontent.com/ivanhohlov14-bit/mars-encyclopedia/main/docs/assets/images/header-banner.png

extra_css:
  - stylesheets/extra.css
  - assets/css/mars-theme.css
  - assets/css/wikipedia-footer.css
  - assets/css/scroll-mode.css
  - stylesheets/hide-dup.css
  - stylesheets/mobile-fast.css
  - stylesheets/mobile-smooth.css
  - stylesheets/wiki-vip.css

extra_javascript:
  # ============ КРИТИЧНО — грузится ВСЕГДА, ВСЕГДА ПЕРВЫМ ============
  - javascripts/mobile-optimizer.js?v=4
  - javascripts/mobile-smooth.js?v=4
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js
  - assets/js/supabase-client.js
  - javascripts/auth-button.js
  - javascripts/session-keeper.js
  - javascripts/wiki-vip.js

  # ============ БАЗОВОЕ — нужно всем ============
  - javascripts/mobile-touch.js
  - javascripts/lazy-images.js
  - javascripts/mobile-cache.js
  - javascripts/comments.js
  - javascripts/comments-loader.js
  - javascripts/experience.js
  - javascripts/page-tracker.js
  - assets/js/article-tools.js
  - assets/js/daily-reward.js
  - assets/js/streak-widget.js
  - assets/js/track-visit.js
  - assets/js/martian-lexicon.js
  - assets/js/martian-mode.js
  - javascripts/sidebar-toggle.js
  - javascripts/sidebar-scroll.js
  - javascripts/remove-nav-buttons.js
  - assets/js/mobile.js
  - assets/js/wikipedia-footer.js?v=7
  - assets/js/language-switcher.js
  - assets/js/scroll-mode.js
  - assets/js/collapse-menu.js?v=12
  - assets/js/auto-categories.js?v=2

  # ============ ЛЕНИВО — грузим после 2 сек (audio, sounds) ============
  - assets/js/gimn-kimeria-data.js?v=1
  - assets/js/gimn-player.js?v=1
  - assets/js/qrcode.min.js
  - assets/js/intro.js
  - assets/js/device-link.js
  - assets/js/qr-scanner.js
  - assets/js/easter-eggs.js
  - assets/js/mars-sound-synth.js?v=1
  - assets/js/yandex-metrika.js?v=1
  - assets/js/effects-menu.js
  - assets/js/vip-cursor.js

extra_head:
  - <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

