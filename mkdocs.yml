# ═══════════════════════════════════════════════════════════
#   МАРСИАНСКАЯ ЭНЦИКЛОПЕДИЯ
#   Production-grade конфигурация v2
# ═══════════════════════════════════════════════════════════

site_name: Марсианская энциклопедия
site_url: https://mars-wiki.ru/
site_description: Свободный справочник о мире «Письмо из Красной пыли» — история, география, персонажи, культура Марса
site_author: Редакция Марсианской энциклопедии
site_favicon: assets/favicon.png

copyright: |
  &copy; 2026 — Марсианская энциклопедия.
  Все права защищены. Материалы доступны по лицензии CC BY-SA 4.0.


# ═══════════════════════════════════════════════════════════
#   ТЕМА
# ═══════════════════════════════════════════════════════════
theme:
  name: readthedocs
  language: ru
  logo: assets/logo.png
  favicon: assets/favicon.png
  sticky_navigation: true
  collapse_navigation: true
  include_homepage_in_sidebar: false
  prev_next_buttons_location: bottom
  navigation_depth: 4
  titles_only: false
  analytics:
    gtag: null
    anonymize_ip: true


# ═══════════════════════════════════════════════════════════
#   ПЛАГИНЫ
# ═══════════════════════════════════════════════════════════
plugins:
  - search:
      lang:
        - ru
        - en
      separator: '[\s\-\.]+'
      min_search_length: 2
      prebuild_index: true

  - advanced-seo:
      url_base: https://mars-wiki.ru
      use_canonical_url: true
      add_schema_org_json_ld: true

  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: false
      cache_safe: true
      js_files:
        - assets/js/*.js
        - javascripts/*.js
      css_files:
        - assets/css/*.css
        - stylesheets/*.css

  - git-revision-date-localized:
      type: date
      timezone: Europe/Moscow
      locale: ru
      fallback_to_build_date: true
      enable_creation_date: true
      exclude:
        - index.md
        - start-here.md

  - git-authors:
      show_email_address: false
      count_empty_lines: true
      sort_by: contributions
      exclude:
        - index.md


# ═══════════════════════════════════════════════════════════
#   MARKDOWN EXTENSIONS
# ═══════════════════════════════════════════════════════════
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: ¶
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - abbr


