# ═══════════════════════════════════════════════════════════
#   МАРСИАНСКАЯ ЭНЦИКЛОПЕДИЯ
#   Конфигурация (stable, без внешних зависимостей для билда)
# ═══════════════════════════════════════════════════════════

site_name: Марсианская энциклопедия
site_url: https://mars-wiki.ru/
site_description: Свободный справочник о мире «Письмо из Красной пыли» — история, география, персонажи, культура Марса
site_author: Редакция Марсианской энциклопедии

# ═══════════════════════════════════════════════════════════
#   ТЕМА
# ═══════════════════════════════════════════════════════════
theme:
  name: readthedocs
  custom_dir: overrides
  language: ru
  locale: ru
  logo: assets/logo.png
  # favicon: https://mars-wiki.ru/assets/favicon.png <-- Убрали отсюда, чтобы не конфликтовало
  sticky_navigation: true
  collapse_navigation: true
  include_homepage_in_sidebar: true
  prev_next_buttons_location: bottom
  navigation_depth: 4

# ═══════════════════════════════════════════════════════════
#   ЖЕЛЕЗОБЕТОННАЯ ФАВИКОНКА
# ═══════════════════════════════════════════════════════════
extra_head:
  - <link rel="icon" type="image/png" href="https://mars-wiki.ru/assets/favicon.png">
  - <link rel="shortcut icon" type="image/png" href="https://mars-wiki.ru/assets/favicon.png">
  - <link rel="apple-touch-icon" href="https://mars-wiki.ru/assets/favicon.png">

# ═══════════════════════════════════════════════════════════
#   ПЛАГИНЫ
# ═══════════════════════════════════════════════════════════
plugins:
  - search
  - advanced-seo:
      url_base: https://mars-wiki.ru
      use_canonical_url: true
      add_schema_org_json_ld: true
  - git-revision-date-localized:
      type: date
      locale: ru
      fallback_to_build_date: true

# ═══════════════════════════════════════════════════════════
#   MARKDOWN EXTENSIONS
# ═══════════════════════════════════════════════════════════
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      toc_depth: 4
  - def_list
  - abbr
  - fenced_code
  - codehilite:
      guess_lang: false
      linenums: false

# ═══════════════════════════════════════════════════════════
#   EXTRA
# ═══════════════════════════════════════════════════════════
extra:
  analytics:
    provider: google
    property: G-GN4G0ZY94H

  meta:
    - property: og:type
      content: website
    - property: og:site_name
      content: Марсианская энциклопедия
    - property: og:locale
      content: ru_RU
    - property: og:title
      content: Марсианская энциклопедия
    - property: og:description
      content: Свободный справочник о мире «Письмо из Красной пыли» — история, география, культура Марса
    - property: og:image
      content: https://mars-wiki.ru/assets/images/header-banner.png
    - property: og:url
      content: https://mars-wiki.ru/
    - name: twitter:card
      content: summary_large_image
    - name: twitter:title
      content: Марсианская энциклопедия
    - name: twitter:description
      content: Свободный справочник о мире «Письмо из Красной пыли»
    - name: twitter:image
      content: https://mars-wiki.ru/assets/images/header-banner.png
    - name: description
      content: Марсианская энциклопедия — полный справочник по миру Марса. История, география, персонажи, мифология, культура.
    - name: keywords
      content: Марс, энциклопедия, вики, письмо из красной пыли, марсианская империя, история Марса, лор, королевства Марса
    - name: author
      content: Редакция Марсианской энциклопедии
    - name: robots
      content: index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1
    - name: theme-color
      content: "#6C63FF"

  link:
    - rel: preconnect
      href: https://cdn.jsdelivr.net
    - rel: preconnect
      href: https://ncytbgbzfjfoqmmgfygz.supabase.co
    - rel: dns-prefetch
      href: https://raw.githubusercontent.com
    - rel: dns-prefetch
      href: https://cdnjs.cloudflare.com
    - rel: dns-prefetch
      href: https://ui-avatars.com
    - rel: dns-prefetch
      href: https://mc.yandex.ru

